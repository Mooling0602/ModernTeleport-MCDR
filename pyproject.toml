[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modern-teleport"
dynamic = ["version"]
description = "A modern teleport plugin with rich functional design for Minecraft servers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "auto-uuid-api-mcdr",
  "location-api",
  "mcdreforged>=2.14.1",
  "moolings-rcon-api",
]

[tool.ruff]
line-length = 79

[tool.hatch.version]
source = "regex"
path = "src/mcdreforged.plugin.json"
pattern = "\"version\"\\s*:\\s*\"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/modern_teleport"]

[tool.uv.sources]
# TODO: tag 0.1.0 of auto-uuid-api-mcdr is stale (missing floodgate regex fix & src/ restructure);
# pin to a new tag (e.g. 0.1.1) once created in the upstream repo.
auto-uuid-api-mcdr = { git = "https://github.com/Mooling0602/Auto-UUID-API-MCDR.git", rev = "b559bfd4ebb2455694f489edda69329fca1ed51c" }
location-api = { git = "https://github.com/Mooling0602/LocationAPI-MCDR.git", tag = "v0.4.4" }
moolings-rcon-api = { git = "https://github.com/Mooling0602/MoolingsRconAPI-MCDR.git", tag = "v0.1.3" }

[dependency-groups]
dev = [
    "docformatter>=1.7.8",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]
docs = [
    "jieba>=0.42.1",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.13.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinx-inline-tabs>=2025.12.21.14",
    "sphinx-intl>=2.4.0",
    "sphinx-prompt>=1.10.2",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-asciinema>=0.4.3",
    "sphinxcontrib-mermaid>=2.1.0",
]
